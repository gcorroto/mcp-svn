name: event-driven
version: 2
description: Event-first workflow — storm the domain, model the flows, then specify, design, contract (AsyncAPI 3.0) and plan
artifacts:
  - id: event-storming
    generates: event-storming.md
    description: Domain discovery — events, commands, actors, policies and bounded contexts
    template: event-storming.md
    instruction: |
      Run a written event-storming session for this change. Produce:
      - `## Domain Events` — past-tense facts (e.g. OrderPlaced), one line of meaning each.
      - `## Commands` — the intents that cause each event, with the actor who issues them.
      - `## Actors & Systems` — humans and external systems involved.
      - `## Policies / Reactions` — "whenever <event> then <command>" automation rules.
      - `## Bounded Contexts` — group the events/commands into contexts and name the
        context boundaries the change touches.
      - `## Hotspots` — open questions, ambiguities and risks discovered while storming.
      Ground every event in the issue description and the existing codebase. Do not
      invent flows the change does not need.
    requires: []
  - id: event-modeling
    generates: event-modeling.md
    description: Structured end-to-end flows (Mermaid) built from the stormed events
    template: event-modeling.md
    instruction: |
      Turn the stormed events into concrete flows. For each user-visible flow produce
      a `## Flow: <name>` section containing:
      - A short narrative of trigger -> command -> event(s) -> read-model/notification.
      - A Mermaid sequence or flow diagram in a fenced mermaid block showing
        actors, commands, events and projections in temporal order.
      - The data each event carries (field list with types).
      Cover the happy path and every failure path the storming hotspots exposed.
      Stay consistent with event-storming.md — same event names, same contexts.
    requires:
      - event-storming
  - id: specs
    generates: specs/**/*.md
    description: Delta specs as user stories with Given/When/Then acceptance criteria derived from the modeled flows
    template: specs/spec.md
    instruction: |
      Write the behavioural specification as OpenSpec delta specs under
      specs/<capability>/spec.md, derived from the flows in event-modeling.md. Name
      each capability after the bounded context its flows live in (for example,
      specs/order-checkout/spec.md), and add one folder per capability when the
      change spans clearly separate capabilities.
      The capability folder is MANDATORY and its name is load-bearing: archive merges
      the file into the canonical openspec/specs/<capability>/spec.md named by that
      folder. OpenSpec 2.x rejects a flat specs/spec.md outright (1.6.0 archived it
      without updating any canonical spec).
      - New capabilities: a kebab-case name for a durable system behavior (for
        example, specs/tray-notifications/spec.md), not the work in this change.
      - Modified capabilities: run `openspec list --specs` and use the exact existing
        folder name from openspec/specs/<capability>/. Do not invent a near-duplicate.

      Each requirement is a user story with Gherkin acceptance criteria: after
      `### Requirement: <name>` write one normative sentence (The system SHALL ...),
      then one line in the form: As a <actor>, I want <capability>, so that <benefit>.
      Then one or more `#### Scenario: <name>` blocks with GIVEN/WHEN/THEN bullets.
      Scenarios must reference the domain events by name
      (e.g. "- **THEN** the OrderPlaced event is published").
      Every flow in event-modeling.md must be covered by at least one scenario.

      Delta operations (use ## headers, only the ones that apply):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - Every scenario MUST have a WHEN/GIVEN step (its trigger) and a THEN step (its outcome), as bullets: `- **GIVEN** ...`, `- **WHEN** ...`, `- **THEN** ...`.
      - Keep each requirement's description (the text between `### Requirement:` and its first scenario) to 500 characters or fewer; move examples and edge cases into scenarios.

      New capabilities only: the delta spec's first section is `## Purpose` -
      one or two sentences (50+ characters) describing what the capability is for.
      Archive copies it into the main spec it creates. Do NOT add `## Purpose` to a
      delta for an existing capability - that spec already has one.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      REMOVED: `### Requirement: <exact existing name>` followed by a
      `**Reason**: ...` line and a `**Migration**: ...` line.
      RENAMED: one pair per rename, the FROM line immediately followed by its TO line:
      - FROM: `### Requirement: <old name>`
      - TO: `### Requirement: <new name>`

      Before finishing, run `openspec validate <change-name>` and fix every ERROR it
      reports: `openspec archive` aborts on a delta it cannot apply.
    requires:
      - event-modeling
  - id: design
    generates: design.md
    description: Technical design — how the modeled events map onto the codebase
    template: design.md
    instruction: |
      Describe HOW the system implements the modeled flows:
      - `## Context` — current state of the affected modules.
      - `## Decisions` — key technical decisions with alternatives considered.
      - `## Event Flow Implementation` — where each command handler, event producer,
        consumer and projection lives (real file paths / modules of this repo).
      - `## Data & Migrations` — schema or storage changes.
      - `## Risks & Mitigations`.
      Stay consistent with event-modeling.md; do not introduce events that were not
      modeled.
    requires:
      - specs
  - id: asyncapi
    generates: asyncapi.yaml
    description: AsyncAPI 3.0 contract for every channel/message in the modeled flows
    template: asyncapi.yaml
    instruction: |
      Author a valid AsyncAPI 3.0 document (asyncapi: 3.0.0) covering every event in
      event-modeling.md:
      - `channels` — one per event stream/topic with a meaningful address.
      - `operations` — send/receive operations bound to their channels.
      - `components.messages` — one message per domain event, payload defined with a
        JSON Schema that matches the field list in event-modeling.md exactly.
      - Reuse existing channel naming conventions if the repo already has AsyncAPI or
        messaging code; otherwise use <context>.<event-name> kebab-case addresses.
      Output MUST be raw YAML (no markdown fences, no prose) so tooling can consume it.
    requires:
      - design
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Derive an ordered implementation checklist covering the design and the AsyncAPI
      contract. Group tasks under `## <numbered section>` headings; every task is a
      `- [ ]` checkbox line that is small and verifiable. Include tasks for: event
      producers, consumers, projections, the AsyncAPI-declared payload shapes, tests
      for every scenario, and wiring/config. Reference spec scenarios where relevant.
    requires:
      - design
      - asyncapi
apply:
  requires:
    - tasks
  tracks: tasks.md
