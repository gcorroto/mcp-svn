name: minimalist
version: 2
description: Lightweight schema for well-scoped, low-risk changes — specs and tasks only
artifacts:
  - id: specs
    generates: specs/**/*.md
    description: Delta specs authored as user stories with Given/When/Then acceptance criteria
    template: specs/spec.md
    instruction: |
      Write the specification as OpenSpec delta specs under specs/<capability>/spec.md,
      one file per capability (add more only when the change spans clearly separate
      capabilities).
      The capability folder is MANDATORY and its name is load-bearing: archive merges
      the file into the canonical openspec/specs/<capability>/spec.md named by that
      folder. OpenSpec 2.x rejects a flat specs/spec.md outright (1.6.0 archived it
      without updating any canonical spec).
      - New capabilities: a kebab-case name for a durable system behavior (for
        example, specs/tray-notifications/spec.md), not the work in this change.
      - Modified capabilities: run `openspec list --specs` and use the exact existing
        folder name from openspec/specs/<capability>/. Do not invent a near-duplicate.

      Each requirement is a user story with Gherkin acceptance criteria: after
      `### Requirement: <name>` write one normative sentence (The system SHALL ...),
      then one line in the form: As a <actor>, I want <capability>, so that <benefit>.
      Then one or more `#### Scenario: <name>` blocks with GIVEN/WHEN/THEN bullets.
      Every scenario must be independently testable.

      Delta operations (use ## headers, only the ones that apply):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - Every scenario MUST have a WHEN/GIVEN step (its trigger) and a THEN step (its outcome), as bullets: `- **GIVEN** ...`, `- **WHEN** ...`, `- **THEN** ...`.
      - Keep each requirement's description (the text between `### Requirement:` and its first scenario) to 500 characters or fewer; move examples and edge cases into scenarios.

      New capabilities only: the delta spec's first section is `## Purpose` -
      one or two sentences (50+ characters) describing what the capability is for.
      Archive copies it into the main spec it creates. Do NOT add `## Purpose` to a
      delta for an existing capability - that spec already has one.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      REMOVED: `### Requirement: <exact existing name>` followed by a
      `**Reason**: ...` line and a `**Migration**: ...` line.
      RENAMED: one pair per rename, the FROM line immediately followed by its TO line:
      - FROM: `### Requirement: <old name>`
      - TO: `### Requirement: <new name>`

      Before finishing, run `openspec validate <change-name>` and fix every ERROR it
      reports: `openspec archive` aborts on a delta it cannot apply.

      Do NOT write a proposal or a design document — this schema intentionally has
      neither. Capture WHAT the system must do; skip HOW and WHY.
    requires: []
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Derive an ordered implementation checklist from the specs. Group tasks under
      `## <numbered section>` headings. Every task is a markdown checkbox line
      (`- [ ] <task>`) that is small, verifiable, and references the requirement or
      scenario it implements. Include tasks for tests that cover every scenario.
    requires:
      - specs
apply:
  requires:
    - tasks
  tracks: tasks.md
